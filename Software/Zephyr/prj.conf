# Hardware Drivers and Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT3XD=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y

# Shell Subsystem
CONFIG_SHELL=y
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_UART_CONSOLE=y

# Optional: history and autocompletion
CONFIG_SHELL_ARGC_MAX=12
CONFIG_SHELL_CMD_BUFF_SIZE=256

# Character Framebuffer (CFB) Subsystem
CONFIG_CHARACTER_FRAMEBUFFER=y

# System Heap
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Enable floating point formatting for printk and shell
CONFIG_CBPRINTF_FP_SUPPORT=y