name: Zephyr Build CI

on:
  push:
    branches: [ ESP ]
  pull_request:
    branches: [ ESP ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:v0.27.4
      options: --user root

    defaults:
      run:
        working-directory: workspace/Software

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Initialize West and Sync Dependencies
        run: |
          west init -l Zephyr
          west update
          west zephyr-export

      - name: Run Native Simulation Test
        run: |
          west build -p -b native_sim Zephyr
          ./build/zephyr/zephyr.exe --test-duration=2

      - name: Build ESP32-S3 Firmware
        run: |
          west build -p -b weact_esp32s3_b/esp32s3/procpu Zephyr

      - name: Upload ESP32-S3 Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-esp32s3-firmware
          path: |
            workspace/Software/build/zephyr/zephyr.bin
            workspace/Software/build/zephyr/zephyr.elf