name: Zephyr Build CI

on:
  push:
    branches: [ ESP ]
  pull_request:
    branches: [ ESP ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:v0.27.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Initialize West and Sync Dependencies
        run: |
          west init -l workspace/Software/Zephyr
          west update
          west zephyr-export

      - name: Build Application
        run: |
          west build -p -b weact_esp32s3_b/esp32s3/procpu workspace/Software/Zephyr

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-esp32s3-firmware
          path: |
            workspace/Software/Zephyr/build/zephyr/zephyr.bin
            workspace/Software/Zephyr/build/zephyr/zephyr.elf